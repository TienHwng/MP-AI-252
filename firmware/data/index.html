<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H.E.R.A - Board Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-titles">
                <h1>Board Configuration</h1>
                <p class="subtitle">WiFi and MQTT provisioning for H.E.R.A.</p>
                <div id="connection-status" class="status disconnected">Connecting...</div>
            </div>
        </header>

        <main>
            <form id="configForm">
                <div class="layout-grid">
                    <section class="card">
                        <div class="card-header"><h2>WiFi Settings</h2></div>
                        <div class="card-body">
                            <div class="form-group">
                                <label for="wifi_ssid">Network Name (SSID)</label>
                                <input type="text" id="wifi_ssid" name="wifi_ssid" placeholder="e.g. Home_Network" class="input-field" autocomplete="off" required>
                            </div>
                            <div class="form-group">
                                <label for="wifi_pass">Password</label>
                                <input type="password" id="wifi_pass" name="wifi_pass" placeholder="Enter WiFi Password" class="input-field" autocomplete="current-password">
                            </div>
                        </div>
                    </section>

                    <section class="card">
                        <div class="card-header"><h2>Server & MQTT</h2></div>
                        <div class="card-body">
                            <div class="form-group">
                                <label for="mqtt_broker">Broker IP/Domain</label>
                                <input type="text" id="mqtt_broker" name="mqtt_broker" placeholder="e.g. 192.168.1.100" class="input-field" autocomplete="off" required>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="mqtt_port">Port</label>
                                    <input type="number" id="mqtt_port" name="mqtt_port" placeholder="1883" class="input-field" required>
                                </div>
                                <div class="form-group">
                                    <label for="sys_token">Auth Token</label>
                                    <input type="text" id="sys_token" name="sys_token" placeholder="Optional" class="input-field" autocomplete="off">
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
                <button type="submit" class="btn primary-btn">Save Configuration & Restart</button>
            </form>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
